name: Package Size Report

on:
  pull_request:
    branches: [master, main]

jobs:
  pkg-size-report:
    permissions: write-all
    name: Package Size Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'pnpm'
      # Advisory only — never block a PR on the size report. It builds the base
      # branch too, so it can fail transiently when base and head differ in
      # install requirements (e.g. a new pnpm build-approval config not yet on
      # base). Correctness is gated by the CI workflow, not this one.
      - name: Package size report
        uses: pkg-size/action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
